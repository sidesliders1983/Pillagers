<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wildlife sightings review · #226</title>
<style>
body { margin: 24px; font: 16px system-ui; background: #e9ecdf; color: #203738; }
main { max-width: 1000px; margin: auto; }
button { min-height: 44px; padding: 10px 18px; margin: 4px; }
iframe { width: 390px; height: 780px; border: 2px solid #203738; max-width: 100%; }
[hidden] { display: none; }
</style>
</head>
<body><main>
<h1>Wildlife sightings review · #226</h1>
<p>This isolated QA opening has extra Food. Wildlife, expedition routes and sightings come from real simulation commands.</p>
<p>Generate checkpoints first with <code>node scripts/qa/wildlife-sightings-226.mjs</code>.</p>
<label>Checkpoint <select id="checkpoint"><option value="unread">Unread first discovery</option><option value="read">Read discovery after save/load</option><option value="legacy">Older physical campaign, recording not adopted</option></select></label>
<button id="desktop">Open desktop Fjord Play</button><button id="phone">Open 390px phone preview</button>
<p role="status">The selected checkpoint replaces this QA server’s session only.</p>
<iframe hidden title="Phone Fjord Play preview"></iframe>
<script type="module">
import { activeSettlementKey, SharedSettlement } from '/src/play/SharedSettlement.ts';
const status = document.querySelector('[role="status"]');
async function open(phone) {
    try {
        const response = await fetch('/scratch/wildlife-sightings-226/' + document.querySelector('select').value + '.json');
        if (!response.ok) throw new Error('Generate the QA checkpoints first.');
        const text = await response.text();
        const owner = SharedSettlement.restore(text, 'fjord');
        sessionStorage.setItem(activeSettlementKey, owner.persist());
        if (phone) {
            const frame = document.querySelector('iframe'); frame.hidden = false;
            frame.src = '/fjord-play'; status.textContent = 'Phone preview opened. Use Attention or Clan Book → Wildlife.';
        } else location.href = '/fjord-play';
    } catch (error) { status.textContent = String(error); }
}
document.querySelector('#desktop').addEventListener('click', () => open(false));
document.querySelector('#phone').addEventListener('click', () => open(true));
</script>
</main></body></html>
