<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Environment Lab · varied pine heights</title><style>body{margin:24px;font:16px system-ui;background:#e7ebdf;color:#173940}main{max-width:1536px;margin:auto}select{font:inherit;padding:8px}img{width:100%;display:block}p{line-height:1.5}a{color:inherit}</style></head><body><main><h1>Environment Lab · 72 pines at 3.5–10.2 m</h1><p><a href="/environment-lab">Open live Environment Lab</a> · <a href="../lab-integration.md">Lab evidence report</a> · <a href="../review.html">Original paired crown study</a></p><label>Recorded view <select id="view"></select></label><p id="caption"></p><img id="capture" alt="Recorded Environment Lab scene with varied conifer heights"><script>const files=['ez-tree-village-standard-day','kaykit-village-standard-day','ez-tree-forest-standard-day','kaykit-forest-standard-day','ez-tree-shore-standard-day','kaykit-shore-standard-day','ez-tree-village-standard-night','kaykit-village-standard-night','ez-tree-forest-low-day','kaykit-forest-low-day'];const s=document.getElementById('view');for(const name of files){const o=document.createElement('option');o.value=name;o.textContent=name.replaceAll('-',' ');s.append(o);}const show=()=>{document.getElementById('capture').src=s.value+'.png';document.getElementById('caption').textContent='Same seed 1983, camera, phase zero, source materials and existing lighting. Optional GrassField OFF.';};s.addEventListener('change',show);show();</script></main></body></html>
