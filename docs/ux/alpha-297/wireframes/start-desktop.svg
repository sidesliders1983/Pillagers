<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"><title>Proposed navigation structure, not a game screenshot</title><style>text{font-family:Arial,sans-serif}</style><rect x="0" y="0" width="1280" height="800" rx="0" fill="#14292c" stroke="#14292c"/><text x="64" y="114" font-size="42" fill="#efe6cf" font-weight="700">FjordSide</text><text x="64" y="150" font-size="20" fill="#efe6cf" font-weight="400">Start or return to play</text><rect x="400" y="90" width="460" height="620" rx="8" fill="#1b3032" stroke="#71817a"/><text x="440" y="150" font-size="30" fill="#efe6cf" font-weight="700">Start</text><rect x="440" y="186" width="380" height="52" rx="8" fill="#354d49" stroke="#e4c67d"/><text x="458" y="219.0" font-size="19" fill="#efe6cf" font-weight="400">Continue</text><text x="440" y="265" font-size="15" fill="#b8c7bc" font-weight="400">Only when a valid save exists</text><rect x="440" y="290" width="380" height="52" rx="8" fill="#243b3d" stroke="#71817a"/><text x="458" y="323.0" font-size="19" fill="#efe6cf" font-weight="400">New game</text><rect x="440" y="358" width="380" height="52" rx="8" fill="#243b3d" stroke="#71817a"/><text x="458" y="391.0" font-size="19" fill="#efe6cf" font-weight="400">Load game / file</text><rect x="440" y="446" width="182" height="52" rx="8" fill="#243b3d" stroke="#71817a"/><text x="458" y="479.0" font-size="19" fill="#efe6cf" font-weight="400">Settings</text><rect x="638" y="446" width="182" height="52" rx="8" fill="#243b3d" stroke="#71817a"/><text x="656" y="479.0" font-size="19" fill="#efe6cf" font-weight="400">Help &amp; credits</text><rect x="440" y="530" width="380" height="48" rx="8" fill="#243b3d" stroke="#71817a"/><text x="458" y="561.0" font-size="17" fill="#efe6cf" font-weight="400">Support &amp; diagnostics</text><text x="440" y="625" font-size="16" fill="#efe6cf" font-weight="400">Real storage warnings stay visible.</text><text x="440" y="653" font-size="16" fill="#efe6cf" font-weight="400">No seed or load-test choice required.</text><rect x="910" y="196" width="306" height="252" rx="8" fill="#1b3032" stroke="#71817a"/><text x="934" y="234" font-size="20" fill="#efe6cf" font-weight="700">New game opens:</text><text x="934" y="280" font-size="19" fill="#efe6cf" font-weight="400">New arrival</text><text x="934" y="319" font-size="19" fill="#efe6cf" font-weight="400">Replay original founding</text><text x="934" y="361" font-size="17" fill="#efe6cf" font-weight="400">Advanced: seed / options</text><text x="934" y="408" font-size="14" fill="#b8c7bc" font-weight="400">Keep replacement confirmation.</text><text x="64" y="752" font-size="16" fill="#b8c7bc" font-weight="400">Source-based hierarchy proposal. Existing game owners and save validation are reused.</text><rect x="0" y="0" width="1280" height="32" rx="0" fill="#e4c67d" stroke="#e4c67d"/><text x="16" y="22" font-size="13" fill="#172b2d" font-weight="700">PROPOSED IA / NOT IMPLEMENTED / NOT A GAME SCREENSHOT</text></svg>