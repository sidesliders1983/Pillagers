  <text x="26" y="323" font-size="15" fill="#b8c7bc" font-weight="400">mobile +1 Year, then a separated</text>
  <text x="26" y="347" font-size="15" fill="#b8c7bc" font-weight="400">New game / Replay replacement section.</text>
