<svg xmlns="http://www.w3.org/2000/svg" width="852" height="393" viewBox="0 0 852 393">
  <title>Proposed menu flow; not implemented and not a game screenshot</title>
  <style>text { font-family: Arial, sans-serif; }</style>
  <rect x="0" y="0" width="852" height="393" rx="0" fill="#14292c" stroke="#14292c"/>
  <rect x="12" y="44" width="828" height="52" rx="8" fill="#1b3032" stroke="#71817a"/>
  <text x="28" y="76" font-size="16" fill="#efe6cf" font-weight="400">Season / year     Existing resources</text>
  <text x="642" y="76" font-size="15" fill="#efe6cf" font-weight="400">Play  Pace  Menu</text>
  <text x="26" y="146" font-size="30" fill="#8baba2" font-weight="700">Existing world</text>
