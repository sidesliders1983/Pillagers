  <text x="26" y="206" font-size="16" fill="#b8c7bc" font-weight="400">+1 Year stays a direct overflow row;</text>
  <text x="26" y="231" font-size="16" fill="#b8c7bc" font-weight="400">disabled during expeditions. No Time submenu.</text>
  <text x="26" y="275" font-size="15" fill="#b8c7bc" font-weight="400">Scrollable menu continues with:</text>
