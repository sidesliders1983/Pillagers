<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Character model preview · FjordSide</title>
<style>
body { margin: 0; background: #242229; color: #f3ded0; font: 16px system-ui; }
canvas { display: block; }
aside { position: absolute; top: 12px; left: 12px; max-width: 240px; background: #242229dc; padding: 12px; border-radius: 12px; }
h1 { font-size: 17px; margin: 0 0 8px; } a { color: #f3b990; } p { line-height: 1.5; font-size: 12px; }
</style>
<aside>
    <h1>Character model preview</h1>
    <div id="status" role="status">Loading model…</div>
    <p>Drag to rotate. Scroll to zoom. This separate preview displays the original benchmark model.</p>
    <a href="/game-assets/characters/dwarf_source.glb" download>Download GLB</a>
</aside>
<script type="importmap">
{"imports":{"three":"/model-preview/vendor/three/build/three.module.js","three/":"/model-preview/vendor/three/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color('#242229');
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, .001, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.append(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xffeee0, 0x77778f, 2));
const light = new THREE.DirectionalLight(0xffffff, 3);
light.position.set(3, 5, -4);
scene.add(light);
new GLTFLoader().load('/game-assets/characters/dwarf_source.glb', gltf => {
    const model = gltf.scene;
    scene.add(model);
    const box = new THREE.Box3().setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    const radius = box.getSize(new THREE.Vector3()).length() / 2;
    controls.target.copy(center);
    camera.position.copy(center).add(new THREE.Vector3(0, .15, -1).normalize()
        .multiplyScalar(radius / Math.sin(THREE.MathUtils.degToRad(20)) * 1.25));
    camera.near = radius / 1000;
    camera.far = radius * 100;
    camera.updateProjectionMatrix();
    controls.update();
    let triangles = 0;
    model.traverse(node => {
        if (node.isMesh) triangles += (node.geometry.index?.count ?? node.geometry.attributes.position.count) / 3;
    });
    document.querySelector('#status').textContent = Math.round(triangles).toLocaleString('en-GB') + ' triangles';
    window.modelLoaded = true;
}, undefined, error => {
    document.querySelector('#status').textContent = 'Could not load the model: ' + error.message;
});
addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
});
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
</html>
